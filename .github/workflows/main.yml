name: SuperStar Auto Study

on:
  # 保留了手动触发按钮，去掉了所有定时任务（schedule）
  # 只有你在 Actions 页面手动点击 Run workflow 时才会运行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 单次任务最长运行 350 分钟（5小时50分），防止跑太久
    timeout-minutes: 350

    steps:
      - name: 拉取代码
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' 

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: 导入配置
        run: |
          echo "${{ secrets.CONFIG }}" > config.ini

      - name: Run main.py
        run: python main.py -c config.ini
